<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pazzo's Italian — Artisanal Coastal Italian | Ocean Beach, San Diego</title>
  <meta name="description" content="Authentic upscale-casual coastal Italian dining at 2163 Abbott St, San Diego, CA 92107. Hand-rolled pasta, fresh Pacific seafood, and curated Italian wines steps from Ocean Beach." />

  <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            espresso: '#141210',
            charcoal: '#1D1A17',
            alabaster: '#FAF7F2',
            parchment: '#F2ECE1',
            gold: '#C5A059',
            goldLight: '#D9BA7C',
            terracotta: '#9E5A40',
            sage: '#6E7B6B',
            ink: '#24201C',
            mutedInk: '#625B53',
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'editorial': '0 24px 60px -15px rgba(20, 18, 16, 0.14)',
            'gold-glow': '0 10px 30px -5px rgba(197, 160, 89, 0.25)',
          }
        }
      }
    }
  </script>

  <style>
    /* Custom subtle grain & editorial scrollbars */
    body {
      background-color: #FAF7F2;
      color: #24201C;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .font-serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* Subtle reveal animation */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1), transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #141210;
    }
    ::-webkit-scrollbar-thumb {
      background: #4A4238;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #C5A059;
    }

    /* Menu fade animation */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .menu-item-animate {
      animation: fadeSlideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Hero slow zoom */
    @keyframes subtleZoom {
      0% { transform: scale(1.02); }
      100% { transform: scale(1.1); }
    }
    .hero-bg-zoom {
      animation: subtleZoom 22s ease-in-out infinite alternate;
    }

    /* Fix native date picker overflow and icon styling on mobile & desktop */
    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
      max-width: 100%;
    }
    input[type="date"]::-webkit-date-and-time-value {
      text-align: left;
    }
    #inline-date::-webkit-calendar-picker-indicator {
      filter: invert(0.85) sepia(0.35) saturate(3) hue-rotate(5deg);
      cursor: pointer;
    }
    #modal-date::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.75;
    }
  </style>
</head>
<body class="antialiased selection:bg-gold selection:text-espresso">

  <!-- ==================== 1. STICKY GLASSMORPHIC NAVIGATION ==================== -->
  <header id="navbar" class="fixed top-0 inset-x-0 z-50 transition-all duration-500 bg-espresso/85 backdrop-blur-md border-b border-white/10">
    <div class="max-w-7xl mx-auto px-5 sm:px-8 lg:px-12">
      <div class="flex items-center justify-between h-20 sm:h-24">
        
        <!-- Brand Wordmark -->
        <a href="#" class="group flex flex-col focus:outline-none">
          <span class="font-serif text-2xl sm:text-[28px] tracking-[0.16em] text-alabaster font-semibold leading-none group-hover:text-gold transition-colors">
            PAZZO'S ITALIAN
          </span>
          <span class="text-[10px] sm:text-[11px] tracking-[0.28em] text-gold/90 uppercase mt-1.5 font-medium">
            Ocean Beach &bull; San Diego
          </span>
        </a>

        <!-- Desktop Navigation Links -->
        <nav class="hidden lg:flex items-center space-x-9">
          <a href="#story" class="text-xs uppercase tracking-[0.2em] text-alabaster/80 hover:text-gold transition-colors py-2">Story</a>
          <a href="#menu" class="text-xs uppercase tracking-[0.2em] text-alabaster/80 hover:text-gold transition-colors py-2">Menu</a>
          <a href="#aperitivo" class="text-xs uppercase tracking-[0.2em] text-alabaster/80 hover:text-gold transition-colors py-2">Wine & Cocktails</a>
          <a href="#experience" class="text-xs uppercase tracking-[0.2em] text-alabaster/80 hover:text-gold transition-colors py-2">Experience</a>
          <a href="#visit" class="text-xs uppercase tracking-[0.2em] text-alabaster/80 hover:text-gold transition-colors py-2">Visit</a>
        </nav>

        <!-- Desktop Reserve Button + Mobile Hamburger -->
        <div class="flex items-center gap-3 sm:gap-4">
          <button onclick="openReservationModal()" class="hidden sm:inline-flex items-center justify-center px-6 py-2.5 rounded-full border border-gold text-gold hover:bg-gold hover:text-espresso text-xs uppercase tracking-[0.2em] font-semibold transition-all duration-300 shadow-gold-glow cursor-pointer">
            Reserve a Table
          </button>

          <!-- Mobile Hamburger Button -->
          <button id="mobile-menu-btn" aria-label="Toggle Menu" class="lg:hidden p-2.5 rounded-xl text-alabaster hover:text-gold hover:bg-white/5 transition-colors focus:outline-none">
            <svg id="hamburger-icon" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
            </svg>
            <svg id="close-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile Dropdown Navigation Drawer -->
    <div id="mobile-menu" class="hidden lg:hidden bg-espresso/98 backdrop-blur-xl border-b border-white/10 px-6 pt-4 pb-8 space-y-4">
      <div class="flex flex-col space-y-3 divide-y divide-white/10">
        <a href="#story" class="mobile-nav-link pt-2 text-sm uppercase tracking-[0.22em] text-alabaster/90 hover:text-gold transition-colors">La Nostra Storia</a>
        <a href="#menu" class="mobile-nav-link pt-3 text-sm uppercase tracking-[0.22em] text-alabaster/90 hover:text-gold transition-colors">Curated Menu</a>
        <a href="#aperitivo" class="mobile-nav-link pt-3 text-sm uppercase tracking-[0.22em] text-alabaster/90 hover:text-gold transition-colors">Wine & Cocktails</a>
        <a href="#experience" class="mobile-nav-link pt-3 text-sm uppercase tracking-[0.22em] text-alabaster/90 hover:text-gold transition-colors">Dining Experience</a>
        <a href="#visit" class="mobile-nav-link pt-3 text-sm uppercase tracking-[0.22em] text-alabaster/90 hover:text-gold transition-colors">Visit & Hours</a>
      </div>
      <div class="pt-4">
        <button onclick="openReservationModal(); toggleMobileMenu(false);" class="w-full py-3.5 rounded-full bg-gold text-espresso text-xs uppercase tracking-[0.22em] font-semibold hover:bg-goldLight transition-colors">
          Reserve a Table
        </button>
      </div>
    </div>
  </header>
